# -----------------------------------------------------------------------------
# Dataset
# -----------------------------------------------------------------------------
dataset:
  root_dir: /home/silvia/Desktop/GIGI/ASI_WGD_2026_Myanmar/BDD/data/patches
  cache_dataset: false
  image_size: 224

# -----------------------------------------------------------------------------
# Output
# -----------------------------------------------------------------------------
output:
  checkpoint_dir: /home/silvia/Desktop/GIGI/ASI_WGD_2026_Myanmar/BDD/results_BDD
  save_checkpoints: true
  save_oof: true

# -----------------------------------------------------------------------------
# Cross validation
# -----------------------------------------------------------------------------
cross_validation:
  seed: 42
  num_folds: 5

# -----------------------------------------------------------------------------
# Model: building-guided gated fusion
# -----------------------------------------------------------------------------
model:
  name: building_guided_fusion
  embed_dim: 128
  use_sar: true
  use_rgb: true

# -----------------------------------------------------------------------------
# Training
# -----------------------------------------------------------------------------
training:
  batch_size: 32
  epochs: 30
  learning_rate: 0.0001
  num_workers: 4

  early_stopping:
    patience: 5

  optimizer:
    name: adamw

  scheduler:
    name: cosine

# -----------------------------------------------------------------------------
# Loss
# -----------------------------------------------------------------------------
loss:
  use_class_weights: true

# -----------------------------------------------------------------------------
# Pretraining
# -----------------------------------------------------------------------------
pretraining:
  use_sar_pretrained: false
  sar_pretrain_path: null

# -----------------------------------------------------------------------------
# Evaluation
# -----------------------------------------------------------------------------
evaluation:
  decision_threshold: 0.5
